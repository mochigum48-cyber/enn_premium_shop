<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunelle</title>
    <!-- Font များ ချိတ်ဆက်ခြင်း -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS ဖိုင် ချိတ်ဆက်ခြင်း -->
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="logo-icon">🦋</div>
            <div class="header-text">
                <span class="welcome">WELCOME TO</span>
                <span class="brand-name">Enn Shop</span>
            </div>
        </div>
        <div class="header-right">
            <button id="mute-btn" class="sound-btn"><i class="fa-solid fa-volume-xmark"></i></button>
            <button id="change-song-btn" class="sound-btn"><i class="fa-solid fa-rotate-right"></i></button>
            <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Promo Banner -->
        <div class="promo-banner">
            <div class="badge">✨ Boost up your socials</div>
            <h1>Make your online <br><i>world sparkle.</i></h1>
            <p>Premium social growth and game top-ups, all in one magical place.</p>
            <button class="explore-btn">Explore services <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i></button>
            
            <!-- လိပ်ပြာပုံလေး -->
            <div class="butterfly-art">🦋</div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="What are you looking for?">
        </div>

        <!-- Category Section -->
        <div class="section-header">
            <div>
                <span class="small-title">FIND YOUR FAVORITE</span>
                <h2 class="section-title">Shop by category</h2>
            </div>
            <a href="#" class="view-all">View all</a>
        </div>

        <div class="category-grid">
            <!-- Instagram -->
            <div class="category-card">
                <div class="cat-icon bg-pink">
                    <i class="fa-brands fa-instagram" style="color: #E1306C;"></i>
                </div>
                <span class="cat-name">Instagram</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <!-- TikTok -->
            <div class="category-card">
                <div class="cat-icon bg-gray">
                    <i class="fa-brands fa-tiktok" style="color: #000;"></i>
                </div>
                <span class="cat-name">TikTok</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <!-- YouTube -->
            <div class="category-card">
                <div class="cat-icon bg-red">
                    <i class="fa-brands fa-youtube" style="color: #FF0000;"></i>
                </div>
                <span class="cat-name">YouTube</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <!-- Games -->
            <div class="category-card">
                <div class="cat-icon bg-purple">
                    <i class="fa-solid fa-gamepad" style="color: #8A6B8E;"></i>
                </div>
                <span class="cat-name">Games</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house icon"></i>
            <span class="text">Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-receipt icon"></i>
            <span class="text">Orders</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-wallet icon"></i>
            <span class="text">Wallet</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-user icon"></i>
            <span class="text">Profile</span>
        </div>
    </nav>

    <!-- Audio & JS -->
    <audio id="bgm" src="bgm.mp3" loop></audio>
    <script src="app.js"></script>
</body>
</html>
