<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunelle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="logo-icon">🦋</div>
            <div class="header-text">
                <span class="welcome">WELCOME TO</span>
                <span class="brand-name">Lunelle</span>
            </div>
        </div>
        <div class="header-right">
            <button id="mute-btn" class="sound-btn">🔇</button>
            <div class="notification-icon">🔔</div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Promo Banner -->
        <div class="promo-banner">
            <div class="badge">✨ Glow up your socials</div>
            <h1>Make your online <br><i>world sparkle.</i></h1>
            <p>Premium social growth and game top-ups, all in one magical place.</p>
            <button class="explore-btn">Explore services <span style="font-size: 16px;">›</span></button>
            
            <div class="butterfly-art">🦋</div>
            <div class="star-art">✦</div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="What are you looking for?">
        </div>

        <!-- Category Section -->
        <div class="section-header">
            <div>
                <span class="small-title">FIND YOUR FAVORITE</span>
                <h2 class="section-title">Shop by category</h2>
            </div>
            <a href="#" class="view-all">View all</a>
        </div>

        <div class="category-grid">
            <div class="category-card">
                <div class="cat-icon bg-pink">🌐</div>
                <span class="cat-name">Instagram</span>
                <span class="arrow">›</span>
            </div>
            <div class="category-card">
                <div class="cat-icon bg-gray">🎵</div>
                <span class="cat-name">TikTok</span>
                <span class="arrow">›</span>
            </div>
            <div class="category-card">
                <div class="cat-icon bg-red">🛒</div>
                <span class="cat-name">YouTube</span>
                <span class="arrow">›</span>
            </div>
            <div class="category-card">
                <div class="cat-icon bg-purple">🎮</div>
                <span class="cat-name">Games</span>
                <span class="arrow">›</span>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="icon">🏠</span>
            <span class="text">Home</span>
        </div>
        <div class="nav-item">
            <span class="icon">📋</span>
            <span class="text">Orders</span>
        </div>
        <div class="nav-item">
            <span class="icon">👛</span>
            <span class="text">Wallet</span>
        </div>
        <div class="nav-item">
            <span class="icon">👤</span>
            <span class="text">Profile</span>
        </div>
    </nav>

    <!-- သီချင်းသံ ဖိုင် -->
    <audio id="bgm" src="bgm.mp3" loop></audio>
    
    <script src="app.js"></script>
</body>
</html>
